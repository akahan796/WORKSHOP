name: Deploy to Vercel (production)

# Optional fallback. Vercel's Git integration already deploys every push to main.
# This workflow only runs when the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# repo secrets are set (e.g. to deploy as the token owner when Vercel's Hobby plan
# blocks commits by a collaborator); without them it skips instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip when Vercel secrets aren't set
        if: env.VERCEL_TOKEN == ''
        run: echo "No VERCEL_TOKEN secret; Vercel's Git integration handles deploys. Skipping."
      - if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4
      # Deploy as the token owner, not the commit author.
      - if: env.VERCEL_TOKEN != ''
        run: rm -rf .git
      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel@latest
      - if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
